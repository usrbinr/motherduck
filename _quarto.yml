project:
  type: website
  output-dir: docs
  resources:
  - man/figures/**
  - /articles/**
  - '!/articles/*.qmd'
  - '!/articles/*.Rmd'
  - '!/articles/*.md'
  render:
  - /index.qmd
  - /reference/*.qmd
  - /articles/*.qmd
  - /articles/*.Rmd
  - /articles/*.md
  - /NEWS.md
  - '!/vignettes/'
  - '!inst/'
  - '!renv/'
  - '!packrat/'
  - '!README.qmd'
  - '!README.Rmd'
  - '!README.md'
  pre-render:
  - /usr/lib/R/bin/Rscript -e "if (requireNamespace('qrtdown', quietly = TRUE)) qrtdown::regenerate(quiet
    = TRUE) else message('qrtdown is not installed; skipping hook')"
  post-render:
  - /usr/lib/R/bin/Rscript -e "if (requireNamespace('qrtdown', quietly = TRUE)) qrtdown::postprocess_site()
    else message('qrtdown is not installed; skipping hook')"
execute:
  freeze: auto
  fig-width: 7.29
  fig-asp: 0.618
  fig-dpi: 96
website:
  title: motherduck
  navbar:
    title: motherduck 0.2.3
    left:
    - text: Get started
      href: vignettes/articles/how-to-connect-to-motherduck.qmd
    - text: Reference
      href: reference/index.qmd
    - text: Articles
      menu:
      - text: How to load data into motherduck
        href: articles/how-to-load-data-in-motherduck.qmd
    - text: Changelog
      href: NEWS.md
    right:
    - icon: github
      href: https://github.com/usrbinr/motherduck
      aria-label: Source code
  page-footer:
    left: Built with [Quarto](https://quarto.org/) and [qrtdown](https://codeberg.org/usrbinr/qrtdown)
    right: motherduck 0.2.4
  repo-url: https://usrbinr.codeberg.page/motherduck/
format:
  html:
    theme:
      light: cosmo
    toc: true
    code-overflow: wrap
    css: _qrtdown-styles.css

